<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="(1) welcomePage.css">
  <title>Login System</title>
</head>

<body>

<div class="container box">

    <div id="signupBox">
      <a href="/public/(2) aboutUs.html" class="top-link">About Us</a>

        <h2>
            <span>C</span>
            <span>r</span>
            <span>e</span>
            <span>a</span>
            <span>t</span>
            <span>e</span>
            <span> </span>
            <span>A</span>
            <span>c</span>
            <span>c</span>
            <span>o</span>
            <span>u</span>
            <span>n</span>
            <span>t</span>
        </h2>

        <input id="signupUser" placeholder="Username">
        <input id="signupPass" type="password" placeholder="Password">
        <br>
        <button id="signupBtn">Create</button>
        <p id="message"></p>
    </div>

    <p class="switch">
        Already have an account?
        <span onclick="showLogin()">Log in!</span>
    </p>

    <div class="hidden" id="loginBox">
        <h2>
            <span>L</span>
            <span>o</span>
            <span>g</span>
            <span> </span>
            <span>I</span>
            <span>n</span>
            <span>!</span>
        </h2>

        <input id="loginUser" placeholder="Username">
        <input id="loginPass" type="password" placeholder="Password">
        <br>

        <button id="loginBtn">Log In</button>
    </div>

    <p class="switch">
        Don’t have an account?
        <span onclick="showSignup()">Create one!</span>
    </p>


</div>

<script>
const signupBtn = document.getElementById("signupBtn");
const loginBtn = document.getElementById("loginBtn");

const signupUser = document.getElementById("signupUser");
const signupPass = document.getElementById("signupPass");
const loginUser = document.getElementById("loginUser");
const loginPass = document.getElementById("loginPass");

function runAway(btn) {
    const x = Math.random() * 150 - 75;
    const y = Math.random() * 150 - 75;
    btn.style.transform = `translate(${x}px, ${y}px)`;
}

signupBtn.addEventListener("mouseover", () => {
    if (!signupUser.value || !signupPass.value) {
        runAway(signupBtn);
    }
});

loginBtn.addEventListener("mouseover", () => {
    if (!loginUser.value || !loginPass.value) {
        runAway(loginBtn);
    }
});

signupBtn.onclick = () => {
    if (!signupUser.value || !signupPass.value) return;

    localStorage.setItem("username", signupUser.value);
    localStorage.setItem("password", signupPass.value);

    document.getElementById("message").textContent =
        "Great! Now you can log in.";

    setTimeout(() => {
        document.getElementById("signupBox").classList.add("hidden");
        document.getElementById("loginBox").classList.remove("hidden");
    }, 1200);
};


loginBtn.onclick = () => {
    const storedUser = localStorage.getItem("username");
    const storedPass = localStorage.getItem("password");

    if (
        loginUser.value === storedUser &&
        loginPass.value === storedPass
    ) {
        localStorage.setItem("loggedIn", "true");

        window.location.href = "/public/(3) dashboard.html";
    } else {
        alert("Invalid username and/or password");
    }
};


function showLogin() {
    document.getElementById("signupBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
}

function showSignup() {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("signupBox").classList.remove("hidden");
}

document.addEventListener("DOMContentLoaded", () => {
    document.body.style.opacity = 0;
    document.body.style.transition = "opacity 1.5s ease";
    requestAnimationFrame(() => {
        document.body.style.opacity = 1;
    });

    function handleMobileView() {
        if (window.innerWidth <= 768) {
            document.body.classList.add("mobile-view");
        } else {
            document.body.classList.remove("mobile-view");
        }
    }

    handleMobileView();
    window.addEventListener("resize", handleMobileView);
});
</script>

</body>
</html>
