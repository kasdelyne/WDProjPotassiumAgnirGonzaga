<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>✦ Welcome Page ✦</title>
    <link rel="stylesheet" href="(1) welcomePage.css">
    <link rel="icon" href="../assets/favicon.png">
</head>
<body>

<div class="card1">
  <div class="middle-bg"></div>

  <div class="header">
    <div class="site-title">
      <div class="small-circle"></div>
      Task-o-naut
    </div>
    <a href="../public/(2) aboutUs.html" class="about-link">About & Creators</a>
  </div>

  <div class="inner-box">
    <div class="left-section">
      <label for="nickname" class="nickname-label">✧ Nickname</label>
      <input type="text" id="nickname" maxlength="10" placeholder="Maximum 10 letters..." class="nickname-input">
      <div class="button-container">
        <a id="proceed-btn" href="../public/(3) dashboard.html" class="proceed-btn">Click</a>
      </div>
    </div>

    <div class="logo-circle">
      <img src="../assets/logo.png" alt="Logo">
    </div>
  </div>
</div>

<script>
const btn = document.getElementById('proceed-btn');
const nickname = document.getElementById('nickname'); 
const buttonContainer = document.querySelector('.button-container');

buttonContainer.style.position = "relative";
btn.style.position = "absolute";
btn.style.left = "0px";
btn.style.top = "0px";

btn.addEventListener('mouseover', () => {
    if (nickname.value.trim() === '') {
        const containerRect = buttonContainer.getBoundingClientRect();
        const btnWidth = btn.offsetWidth;
        const btnHeight = btn.offsetHeight;

        // Calculate random position within container
        const x = Math.random() * (containerRect.width - btnWidth);
        const y = Math.random() * (containerRect.height - btnHeight);

        btn.style.left = `${x}px`;
        btn.style.top = `${y}px`;
    }
});

// Disable click if nickname empty
btn.addEventListener('click', (e) => {
    if (nickname.value.trim() === '') {
        e.preventDefault(); // Prevent navigation
    }
});


document.addEventListener("DOMContentLoaded", () => {
    document.body.style.opacity = 0;
    document.body.style.transition = "opacity 1.5s ease";
    requestAnimationFrame(() => {
        document.body.style.opacity = 1;
    });

    function handleMobileView() {
        if (window.innerWidth <= 768) {
            document.body.classList.add("mobile-view");
        } else {
            document.body.classList.remove("mobile-view");
        }
    }

    handleMobileView();
    window.addEventListener("resize", handleMobileView);
});
</script>

</body>
</html>
