<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weekly Study Planner & Timer</title>
  <style>
body {
    margin: 0;
    font-family: 'Quicksand', sans-serif;
    background: linear-gradient(110deg, #5c3279, #d54f9fdf 100%, #f89cc8 100%);
    color: #333;
    animation: gradientFlow 10s ease infinite;
}
@keyframes gradientFlow {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
            }
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url('https://i.pinimg.com/1200x/5a/67/9b/5a679bc4d2bc5a2547b4e83594a5277f.jpg') no-repeat center/cover;
  background-size: 100%;
  opacity: 0.25;        
  pointer-events: none; 
  z-index: -1;
}
.planner {
    max-width: 1100px;
    margin: 10px auto;
    background: white;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
    padding: 10px;
}

h2 {
    text-align: center;
    color: #6a4fb3;
    margin-bottom: 1rem;
}

.top-section {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    margin-bottom: 2rem;
}

.top-section input, .top-section select {
    padding: 0.5rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: 100%;
}

.sidebar {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 2rem;
}

.sidebar label {
    font-weight: 600;
    margin-bottom: 0.3rem;
}

.sidebar input {
    padding: 0.5rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    width: calc(100% - 60px);
}

.sidebar .entry-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.sidebar button {
    padding: 0.5rem;
    border: none;
    border-radius: 8px;
    background-color: #d1c4e9;
    cursor: pointer;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
}

th, td {
    border: 1px solid #ddd;
    padding: 0.5rem;
    text-align: center;
}

th {
    background-color: #f3e5f5;
}

select.priority {
    padding: 0.3rem;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.priority-low {
    background-color: #c8e6c9;
}

.priority-medium {
    background-color: #fff9c4;
}

.priority-high {
    background-color: #ffcdd2;
}

.complete-btn {
    background-color: #b39ddb;
    border: none;
    padding: 0.4rem 0.8rem;
    border-radius: 6px;
    cursor: pointer;
}

.add-task-btn {
    margin-top: 1rem;
    background-color: #d1c4e9;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 8px;
    cursor: pointer;
}
.study-timer {
    margin: 10px auto;
    max-width: 1100px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
    padding: 10px;
    text-align: center;
    font-family: 'Quicksand', sans-serif;
    }

.study-timer h2 {
    color: #6a4fb3;
    margin-bottom: 1rem;
}

.timer-display {
    font-size: 2rem;
    background-color: #f3e5f5;
    padding: 1rem 2rem;
    border-radius: 12px;
    margin-bottom: 1rem;
    display: inline-block;
}

.timer-controls button {
    padding: 0.5rem 1rem;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background-color: #ce93d8;
    cursor: pointer;
    margin: 0 0.5rem;
}

.total-time {
    margin-top: 2rem;
}

.total-boxes {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-top: 0.5rem;
}

.total-boxes div {
    background-color: #e1bee7;
    padding: 0.5rem;
    border-radius: 8px;
    width: 80px;
    text-align: center;
    font-weight: bold;
}

  </style>
</head>
<body>
  <div class="planner">
    <h2>Weekly Study Planner</h2>

    <div class="top-section">
      <div>
        <label>Date:</label>
        <input type="date" />
      </div>
      <div>
        <label>Week of Month:</label>
        <select>
          <option>Week 1</option>
          <option>Week 2</option>
          <option>Week 3</option>
          <option>Week 4</option>
        </select>
      </div>
    </div>

    <div class="sidebar">
      <div>
        <label>Focus Subjects:</label>
        <div class="entry-group">
          <input type="text" placeholder="Subject 1" />
          <button>+ Add</button>
        </div>
      </div>
      <div>
        <label>Study Session Goals:</label>
        <div class="entry-group">
          <input type="text" placeholder="Goal 1" />
          <button>+ Add</button>
        </div>
      </div>
    </div>

    <table id="taskTable">
      <thead>
        <tr>
          <th>Tasks</th>
          <th>Deadline</th>
          <th>Priority</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" placeholder="Task 1" /></td>
          <td><input type="date" /></td>
          <td>
            <select class="priority">
              <option class="priority-low">Low</option>
              <option class="priority-medium">Medium</option>
              <option class="priority-high">High</option>
            </select>
          </td>
          <td><button class="complete-btn">Complete</button></td>
        </tr>
      </tbody>
    </table>
    <button class="add-task-btn" onclick="addRow()">+ Add Task</button>
  </div>

 <div class="study-timer">
  <h2>Study Timer</h2>
  <div class="timer-display" id="mainTimer">00:00:00</div>
  <div class="timer-controls">
    <button onclick="startTimer()">Start</button>
    <button onclick="pauseTimer()">Pause</button>
  </div>
  <div class="total-time">
    <h3>Total Time Breakdown</h3>
    <div class="total-boxes">
      <div><span id="sec">00</span><br>seconds</div>
      <div><span id="min">00</span><br>minutes</div>
      <div><span id="hr">00</span><br>hours</div>
    </div>
  </div>
</div>

</body>
</html>
