<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> ✦ Memory Game ✦</title>
        <link rel="icon" href="../assets/favicon.png">
        <link rel="stylesheet" href=".css">
        <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">
        <style>
            body{
                font-family: 'Yeseva One', 'Times New Roman', Georgia, 'Times New Roman', Times, serif;
                text-align: center;
                 background: linear-gradient(110deg, #5c3279, #d54f9fdf 50%, #f2e291 100%);
  background-size: 200% 200%;
  animation: gradientFlow 10s ease infinite;
                background-color: white;
                margin: 0;
                padding: 20px;
            }
        body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url('https://i.pinimg.com/1200x/5a/67/9b/5a679bc4d2bc5a2547b4e83594a5277f.jpg') center/cover no-repeat;
  opacity: 0.25;    
  pointer-events: none; 
  z-index: -1;         
}
@keyframes gradientFlow {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
            
            h1{
                color: #333;
            }

            .game-container{
                display: grid;
                grid-template-columns: repeat(4,100px);
                grid-gap: 50px;
                justify-content: center;
                margin: 20px 0;
            }

            .card {
                width: 100px;
                height: 100px;
                background-color: #1e90ff;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 50px;
                cursor: pointer;
                border-radius: 10px;
                transition: transform 0.3s;
            }

            .card.flipped {
                background-color: #fff;
                transform: rotateY(180deg);
            }

            button {
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                border-radius: 5px;
                border: none;
                background-color: #1e90ff;
                color: #fff;
            }

            button:hover {
                background-color: #4f6377;
            }
            #navtoggle{
                position: fixed;
                font-size: 20px;
                font-weight: bold;
                top: 0;
                left: 3px;
                z-index: 1000;
                padding: 10px 15px;
                cursor: pointer;
                border-radius: 5px;
                color: #3b3545;
                transition: scale 0.2s ease;
            }
            #navtoggle:hover{
                scale: 1.1;
            }

            .navbar{
                width: 250px;
                position: fixed;
                top: 0;
                left: -250px;
                max-height: 100%;
                height: 70%;
                background-color: rgba(255, 255, 255, 0.621);
                color: #746c7f;
                box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
                transition: left 0.3s ease;
                z-index: 1;
            }

            .navbar.open{
                left: 0;
                border-radius: 20px;
                margin-left: 5px;
                font-size: 16px;
            }

            #navbar ul{
                list-style: none;
                padding:0;
            }

            #navbar ul li{
                text-align: center;
                margin-top: 40px;
            }

            #navbar ul li a{
                color: #5f576b;
                text-decoration: none;
                font-weight: bold;
                font-size: 20px;
            }

            #navbar ul li a:hover{
                background: linear-gradient(180deg, rgba(115, 82, 146, 1) 0%, #cd858f 100%);
                color: #ffeab3;
                padding: 10px 5px;
                border-radius: 15px;
                margin-left: 28px;
                margin-right: 28px;
                display: block;
                transition: 0.3s ease;
            }

            #navbar ul li a.active{
                background: linear-gradient(180deg, rgba(115, 82, 146, 1) 0%, #cd858f 100%);
                color: #ffeab3;
                padding: 10px 15px;
                border-radius: 15px;
                display: block;
                font-weight: bold;
            }
        </style>
        <body>

            <div id="navtoggle" onclick="toggleNavBar()">☰</div>
        
                <nav id="navbar" class="navbar">
                    <ul>
                        <li> <a href="(3) dashboard.html"> Dashboard </a></li>
                        <li> <a href="(4) calendar.html"> Calendar</a></li>
                        <li> <a href="(5) activeRecall.html"> Active Recall </a></li>
                        <li> <a href="(6) memoryGame.html"> Memory Game</a></li>
                        <li> <a href="(7) dressUp.html"> Dress Up</a></li>
                        <li> <a href="(9) calculator.html"> Calculator</a></li>
                        <li> <a href="(8) settings.html"> Settings </a></li>
                        <li> <a href="(10) references.html"> References</a></li>
                    </ul>
                </nav>

            <h1>Emoji Memory Game</h1>
            <div class="game-container" id="gameContainer"></div>
            <button id="restartBtn">Restart Game</button>


                <script>
                    const gameContainer = document.getElementById('gameContainer');
                    const restartBtn = document.getElementById('restartBtn');

                    const emojis = ["🍪","👅","🐤","🎧","☕️","🤍","👝","😛"];
                    let cardArray = [...emojis, ...emojis]; // Duplicate for pairs
                    let flippedCards = [];
                    let matchedCards = [];

                    // Shuffle cards
                    function shuffle(array) {
                        for (let i = array.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [array[i], array[j]] = [array[j], array[i]];
                        }
                        return array;
                    }

                    // Create the game board
                    function createBoard() {
                        gameContainer.innerHTML = '';
                        shuffle(cardArray);
                        cardArray.forEach((emoji, index) => {
                            const card = document.createElement('div');
                            card.classList.add('card');
                            card.dataset.emoji = emoji;
                            card.dataset.index = index;
                            card.innerHTML = ''; // Hide emoji initially
                            card.addEventListener('click', flipCard);
                            gameContainer.appendChild(card);
                        });
                    }

                    // Flip card
                    function flipCard() {
                        if (
                            flippedCards.length < 2 &&
                            !this.classList.contains('flipped') &&
                            !matchedCards.includes(this.dataset.index)
                        ) {
                            this.classList.add('flipped');
                            this.textContent = this.dataset.emoji;
                            flippedCards.push(this);

                            if (flippedCards.length === 2) {
                                setTimeout(checkMatch, 800);
                            }
                        }
                    }

                    // Check for match
                    function checkMatch() {
                        const [card1, card2] = flippedCards;
                        if (card1.dataset.emoji === card2.dataset.emoji) {
                            matchedCards.push(card1.dataset.index, card2.dataset.index);
                        } else {
                            card1.classList.remove('flipped');
                            card2.classList.remove('flipped');
                            card1.textContent = '';
                            card2.textContent = '';
                        }
                        flippedCards = [];

                        if (matchedCards.length === cardArray.length) {
                            setTimeout(() => alert("🎉 You Won!"), 300);
                        }
                    }

                    // Restart game
                    restartBtn.addEventListener('click', () => {
                        flippedCards = [];
                        matchedCards = [];
                        createBoard();
                    });

                    createBoard();

                    function toggleNavBar(){
                    const nav=document.getElementById("navbar");
                    nav.classList.toggle("open");
                    }
                </script>
        </body>
    </head>
</html>
