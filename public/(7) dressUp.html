<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title> ✦ Dress-Up ✦</title>
    <link rel="icon" href="../assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Yeseva+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href=".css">

    <style>
        body {
              background: linear-gradient(110deg, #5c3279, #d54f9fdf 50%, #f2e291 100%);
  background-size: 200% 200%;
  animation: gradientFlow 10s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Yeseva One', 'Times New Roman', sans-serif;
            color: #ffeab3;
        }
        body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url('https://i.pinimg.com/1200x/5a/67/9b/5a679bc4d2bc5a2547b4e83594a5277f.jpg') center/cover no-repeat;
  opacity: 0.25;    
  pointer-events: none; 
  z-index: -1;         
}
@keyframes gradientFlow {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

        .game-container {
            width: 380px;
            background: rgba(255,255,255,0.18);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
        }

        .display-area {
            width: 100%;
            height: 320px;
            background: #ffe9c8;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            pointer-events: none;
        }

        .bottom-row {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ffe9c8;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .circle img {
            width: 90%;
        }

        .arrow {
            background: none;
            border: none;
            font-size: 40px;
            color: #8bd0e4;
            cursor: pointer;
        }

        .category-label {
            text-align: center;
            margin-top: 10px;
            color: white;
            font-size: 20px;
        }

                    #navtoggle {
                position: fixed;
                font-size: 20px; 
                font-weight: bold;
                top: 0;
                left: 3px;
                z-index: 1000;
                padding: 10px 15px;
                cursor: pointer;
                border-radius: 5px;
                color: #3b3545;
                transition: transform 0.2s ease; 
            }
            #navtoggle:hover {
                transform: scale(1.1);
            }

            .navbar {
                width: 250px;             
                position: fixed;
                top: 0;
                left: -250px;
                height: 550px;            
                background: rgba(255, 255, 255, 0.75); 
                color: #737373;
                box-shadow: 0 0 20px #a86fa3; 
                transition: left 0.3s ease;
                z-index: 1;
            }

            @keyframes slideIn {
                from { left: -230px; }
                to { left: 0; }
            }

            .navbar.open {
                left: 0;
                border-radius: 20px;
                margin-left: 5px;
                font-size: 16px; 
            }

            #navbar ul {
                list-style: none;
                padding: 0;
            }

            #navbar ul li {
                text-align: center;
                margin-top: 40px;
            }

            #navbar ul li a {
                color: #646464;
                text-decoration: none;
                font-weight: bold;
                font-size: 20px; 
            }

            #navbar ul li a:hover {
                background: linear-gradient(180deg, #735292 0%, #cd858f 100%);
                color: #ffeab3;
                padding: 10px 5px;
                border-radius: 15px;
                margin-left: 28px;
                margin-right: 28px;
                display: block;
                transition: 0.3s ease;
            }

            #navbar ul li a.active {
                background: linear-gradient(180deg, #735292 0%, #cd858f 100%);
                color: #ffeab3;
                padding: 10px 15px;
                border-radius: 15px;
                display: block;
                font-weight: bold;
            }

            .submenu {
                display: none;
                list-style: none;
                padding-left: 10px;
                margin: 0;
            }

            .has-submenu:hover .submenu {
                display: block;
            }

            .submenu li {
                padding: 10px;
                background: #6c4c8f; 
                margin-top: 5px;
                border-radius: 5px;
            }

            .submenu li a {
                color: #ffeab3;
            }
            

    </style>
</head>
<body>
    <h1> Dress-Up </h1>
    <p> .</p>
        <div id="navtoggle" onclick="toggleNavBar()">☰</div>
        
        <nav id="navbar" class="navbar">
            <ul>
                <li> <a href="(3) dashboard.html"> Dashboard </a></li>
                <li> <a href="(4) calendar.html"> Calendar</a></li>
                <li> <a href="(5) activeRecall.html"> Active Recall </a></li>
                <li> <a href="(6) memoryGame.html"> Memory Game</a></li>
                <li> <a href="(7) dressUp.html"> Dress Up</a></li>
                <li> <a href="(9) calculator.html"> Calculator</a></li>
                <li> <a href="(8) settings.html"> Settings </a></li>
                <li> <a href="(10) references.html"> References</a></li>
                </li>
            </ul>
        </nav>

    <div class="game-container">

        <div class="display-area">
            <img id="base" class="layer" src="/assets/base.png">

            <img id="hair" class="layer">
            <img id="dress" class="layer">
            <img id="shirt" class="layer">
            <img id="pants" class="layer">
            <img id="accessory" class="layer">
        </div>

        <div class="bottom-row">
            <button class="arrow" id="prevBtn">&#10094;</button>

            <div class="circle" id="opt1"></div>
            <div class="circle" id="opt2"></div>
            <div class="circle" id="opt3"></div>

            <button class="arrow" id="nextBtn">&#10095;</button>
        </div>

        <div style = "text-align: center; margin-top: 10px;">
            <button id="removeBtn" style = " 
                background: #ffb6b6;
                color: white;
                border: none;
                padding: 8px 20px;
                border-radius: 12px;
                cursor: pointer;
                font-size: 16px;"> Remove </button>
        </div>

        <div class="category-label" id="categoryLabel">Hair</div>

    </div>

    <script>
        // categories and options
        const items = {
            hair: ["../assets/hair1.png", "/assets/hair2.png", "/assets/hair3.png"],
            dress: ["/assets/dress.png"],
            shirt: ["/assets/shirt1.png", "/assets/shirt2.png"],
            pants: ["/assets/pants1.png", "/assets/pants2.png"],
            accessory: ["/assets/accessory1.png", "/assets/accessory2.png"]
        };

        const categories = Object.keys(items);
        let currentCategoryIndex = 0;

        // html elements
        const categoryLabel = document.getElementById("categoryLabel");
        const circles = [ 
            document.getElementById("opt1"), 
            document.getElementById("opt2"), 
            document.getElementById("opt3") 
        ];

        // update circles for current category
        function loadCategory() {
            const category = categories[currentCategoryIndex];
            const list = items[category];

            categoryLabel.textContent = category.charAt(0).toUpperCase() + category.slice(1);

            circles.forEach((circle, i) => {
                circle.innerHTML = "";

                if (list[i]) {
                    let img = document.createElement("img");
                    img.src = list[i];
                    circle.appendChild(img);

                    circle.onclick = () => {
                        document.getElementById(category).src = list[i];
                    };
                } else {
                    circle.onclick = null;
                }
            });
        }

        // arrows
        document.getElementById("prevBtn").onclick = () => {
            currentCategoryIndex =
                (currentCategoryIndex - 1 + categories.length) % categories.length;
            loadCategory();
        };

        document.getElementById("nextBtn").onclick = () => {
            currentCategoryIndex =
                (currentCategoryIndex + 1) % categories.length;
            loadCategory();
        };

        // initialize
        loadCategory();

        const removeBtn = document.getElementById("removeBtn");

        removeBtn.onclick = () =>{
            const category = categories[currentCategoryIndex];
            document.getElementById(category).src=" ";
        }

        function toggleNavBar(){
            const nav=document.getElementById("navbar");
            nav.classList.toggle("open");
        }
    </script>
</body>
</html>
