<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> ✦ Memory Game ✦</title>
        <link rel="stylesheet" href=".css">

        <style>
            body{
                font-family: 'Times New Roman', Georgia, 'Times New Roman', Times, serif;
                text-align: center;
                background-color: white;
                margin: 0;
                padding: 20px;
            }
            
            h1{
                color: #333;
            }

            .game-container{
                display: grid;
                grid-template-columns: repeat(4,100px);
                grid-gap: 50px;
                justify-content: center;
                margin: 20px 0;
            }

            .card {
                width: 100px;
                height: 100px;
                background-color: #1e90ff;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 50px;
                cursor: pointer;
                border-radius: 10px;
                transition: transform 0.3s;
            }

            .card.flipped {
                background-color: #fff;
                transform: rotateY(180deg);
            }

            button {
                padding: 10px 20px;
                font-size: 16px;
                cursor: pointer;
                border-radius: 5px;
                border: none;
                background-color: #1e90ff;
                color: #fff;
            }

            button:hover {
                background-color: #4f6377;
            }
        </style>
        <body>
            <h1>Emoji Memory Game</h1>
            <div class="game-container" id="gameContainer"></div>
            <button id="restartBtn">Restart Game</button>
                <script>
                    const gameContainer = document.getElementById('gameContainer');
                    const restartBtn = document.getElementById('restartBtn');

                    const emojis = ["🐶","🐱","🦊","🐻","🐼","🐨","🐯","🦁"];
                    let cardArray = [...emojis, ...emojis]; // Duplicate for pairs
                    let flippedCards = [];
                    let matchedCards = [];

                    // Shuffle cards
                    function shuffle(array) {
                        for (let i = array.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [array[i], array[j]] = [array[j], array[i]];
                        }
                        return array;
                    }

                    // Create the game board
                    function createBoard() {
                        gameContainer.innerHTML = '';
                        shuffle(cardArray);
                        cardArray.forEach((emoji, index) => {
                            const card = document.createElement('div');
                            card.classList.add('card');
                            card.dataset.emoji = emoji;
                            card.dataset.index = index;
                            card.innerHTML = ''; // Hide emoji initially
                            card.addEventListener('click', flipCard);
                            gameContainer.appendChild(card);
                        });
                    }

                    // Flip card
                    function flipCard() {
                        if (
                            flippedCards.length < 2 &&
                            !this.classList.contains('flipped') &&
                            !matchedCards.includes(this.dataset.index)
                        ) {
                            this.classList.add('flipped');
                            this.textContent = this.dataset.emoji;
                            flippedCards.push(this);

                            if (flippedCards.length === 2) {
                                setTimeout(checkMatch, 800);
                            }
                        }
                    }

                    // Check for match
                    function checkMatch() {
                        const [card1, card2] = flippedCards;
                        if (card1.dataset.emoji === card2.dataset.emoji) {
                            matchedCards.push(card1.dataset.index, card2.dataset.index);
                        } else {
                            card1.classList.remove('flipped');
                            card2.classList.remove('flipped');
                            card1.textContent = '';
                            card2.textContent = '';
                        }
                        flippedCards = [];

                        if (matchedCards.length === cardArray.length) {
                            setTimeout(() => alert("🎉 You Won!"), 300);
                        }
                    }

                    // Restart game
                    restartBtn.addEventListener('click', () => {
                        flippedCards = [];
                        matchedCards = [];
                        createBoard();
                    });

                    createBoard();

                </script>
        </body>
    </head>
</html>
