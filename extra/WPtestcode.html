<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weekly Study Planner & Timer</title>
  <style>
body {
  margin: 0;
  font-family: 'Quicksand', sans-serif;
  background: linear-gradient(to bottom right, #fceff9, #e0f7fa);
  color: #333;
}

.planner {
  max-width: 1100px;
  margin: 10px auto;
  background: white;
  border-radius: 16px;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
  padding: 10px;
}

h2 {
  text-align: center;
  color: #6a4fb3;
  margin-bottom: 1rem;
}

.content-layout {
  display: flex;
  gap: 2rem;
  margin-top: 2rem;
}

.left-sidebar {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.left-sidebar .top-section {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.left-sidebar .top-section label {
  font-weight: bold;
  margin-bottom: 0.2rem;
}

.date-range {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.date-range input {
  padding: 0.4rem;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.left-sidebar .sidebar {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.left-sidebar .sidebar label {
  font-weight: bold;
  margin-bottom: 0.2rem;
}

.left-sidebar .sidebar input {
  padding: 0.4rem;
  border-radius: 6px;
  border: 1px solid #ccc;
  width: calc(100% - 40px);
}

.left-sidebar .entry-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.left-sidebar button {
  padding: 0.4rem;
  border: none;
  border-radius: 6px;
  background-color: #d1c4e9;
  cursor: pointer;
}

.task-area {
  flex: 2;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 1rem;
}

th, td {
  border: 1px solid #ddd;
  padding: 0.5rem;
  text-align: center;
}

th {
  background-color: #f3e5f5;
}

select.priority {
  padding: 0.3rem;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.priority-low { background-color: #c8e6c9; }
.priority-medium { background-color: #fff9c4; }
.priority-high { background-color: #ffcdd2; }

.complete-btn {
  background-color: #b39ddb;
  border: none;
  padding: 0.4rem 0.8rem;
  border-radius: 6px;
  cursor: pointer;
}

.add-task-btn {
  margin-top: 1rem;
  background-color: #d1c4e9;
  border: none;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  cursor: pointer;
}

.study-timer {
  margin: 10px auto;
  max-width: 1100px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
  padding: 10px;
  font-family: 'Quicksand', sans-serif;
}

.study-timer h2 {
  color: #6a4fb3;
  margin-bottom: 1rem;
  text-align: center;
}

.timer-layout {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 2rem;
}

.timer-left {
  flex: 1;
  text-align: center;
}

.timer-right {
  flex: 1;
  text-align: center;
}

.timer-display {
  font-size: 2rem;
  background-color: #f3e5f5;
  padding: 1rem 2rem;
  border-radius: 12px;
  margin-bottom: 1rem;
  display: inline-block;
}

.timer-controls {
  margin-top: 1rem;
}

.timer-controls button {
  padding: 0.5rem 1rem;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  background-color: #ce93d8;
  cursor: pointer;
  margin: 0 0.5rem;
}

.total-boxes {
  display: flex;
  justify-content: center;
  gap: 1rem;
  margin-top: 0.5rem;
}

.total-boxes div {
  background-color: #e1bee7;
  padding: 0.5rem;
  border-radius: 8px;
  width: 80px;
  text-align: center;
  font-weight: bold;
}
  </style>
</head>
<body>
  <div class="planner">
    <h2>Weekly Study Planner</h2>

    <div class="content-layout">
  
      <div class="left-sidebar">
        <div class="top-section">
          <div>
            <label>📅 Range:</label>
            <div class="date-range">
              <input type="date" id="startDate" />
              <span>to</span>
              <input type="date" id="endDate" />
            </div>
          </div>
          <div>
            <label>Week:</label>
            <input type="text" id="weekDisplay" readonly />
          </div>
        </div>

        <div class="sidebar">
          <div>
            <label>Focus:</label>
            <div class="entry-group">
              <input type="text" placeholder="Subject" />
              <button>+</button>
            </div>
          </div>
          <div>
            <label>Goals:</label>
            <div class="entry-group">
              <input type="text" placeholder="Goal" />
              <button>+</button>
            </div>
          </div>
        </div>
      </div>

      <div class="task-area">
        <table id="taskTable">
          <thead>
            <tr>
              <th>Tasks</th>
              <th>Deadline</th>
              <th>Priority</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><input type="text" placeholder="Task 1" /></td>
              <td><input type="date" /></td>
              <td>
                <select class="priority">
                  <option class="priority-low">Low</option>
                  <option class="priority-medium">Medium</option>
                  <option class="priority-high">High</option>
                </select>
              </td>
              <td><button class="complete-btn">Complete</button></td>
            </tr>
          </tbody>
        </table>
        <button class="add-task-btn" onclick="addRow()">+ Add Task</button>
      </div>
    </div>
  </div>

  <div class="study-timer">
    <h2>Study Timer</h2>
    <div class="timer-layout">
      <div class="timer-left">
        <div class="timer-display" id="mainTimer">00:00:00</div>
        <div class="timer-controls">
          <button onclick="startTimer()">Start</button>
          <button onclick="pauseTimer()">Pause</button>
        </div>
      </div>
      <div class="timer-right">
        <h3>Total Time Breakdown</h3>
        <div class="total-boxes">
          <div><span id="sec">00</span><br>seconds</div>
          <div><span id="min">00</span><br>minutes</div>
          <div><span id="hr">00</span><br>hours</div>
        </div>
      </div>
    </div>
  </div>

<script>
function calculateWeek() {
  const start = document.getElementById("startDate").value;
  const end = document.getElementById("endDate").value;
  const weekDisplay = document.getElementById("weekDisplay");

  if (start && end) {
    const startDate = new Date(start);
    const day = startDate.getDate();
    const weekNum = Math.ceil(day / 7);
    const monthName = startDate.toLocaleString('default', { month: 'long' });
    weekDisplay.value = `Week ${weekNum} of ${monthName}`;
  }
}

document.getElementById("startDate").addEventListener("change", calculateWeek);
document.getElementById("endDate").addEventListener("change", calculateWeek);
</script>
